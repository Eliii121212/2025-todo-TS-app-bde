name: EliWorkflow

on: 
  push:
    branches:
      - develop
    feature:
      - main  
  
jobs:
  integration-delivery:
    runs-on: ubuntu-latest
    enviroment: Test
    container:
      image: node
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build


    